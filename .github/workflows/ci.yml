name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check syntax
      run: |
        python -m py_compile src/main.py
        python -m py_compile app/app.py

    - name: Test data loading
      run: |
        python -c "
        import pandas as pd
        from pathlib import Path
        data_path = Path('Data/india_aqi.csv')
        if data_path.exists():
            df = pd.read_csv(data_path)
            print(f'Dataset loaded successfully: {len(df)} rows')
        else:
            print('Dataset not found')
        "

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/main.py app/app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/main.py app/app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics